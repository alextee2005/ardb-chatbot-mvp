name: Scrape ARDB pages (stage 1)

# Stage 1 of two. This workflow archives ARDB's pages exactly as published
# into knowledge/raw/ardb-raw.json and stops there. It does not touch the
# corpus, so merging its pull request changes nothing a customer sees.
#
# Stage 2 ("Build corpus") turns the archive into the English corpus the bot
# answers from. It runs automatically once this workflow's pull request lands
# on the default branch, and can be run by hand at any time.
#
# Opens a pull request rather than committing directly. The crawler is a
# heuristic over a WordPress theme, and an unreviewed archive is how a
# navigation blob -- or a wrong interest rate -- starts its journey towards a
# customer.
on:
  workflow_dispatch:
    inputs:
      max_pages:
        description: "Maximum pages to crawl"
        required: false
        default: "60"
        type: string
      ignore_robots:
        description: "Crawl regardless of robots.txt (ARDB's own site only)"
        required: false
        default: false
        type: boolean
      dry_run:
        description: "Report what would change without opening a pull request"
        required: false
        default: false
        type: boolean
  schedule:
    # 03:17 UTC on the first of each month. An odd minute because schedules on
    # the hour are the most delayed; monthly because published product terms
    # change slowly.
    - cron: "17 3 1 * *"

permissions:
  contents: write
  pull-requests: write

concurrency:
  # Two concurrent scrapes would race on the same branch.
  group: scrape-knowledge
  cancel-in-progress: false

jobs:
  scrape:
    name: Archive the pages as published
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tools/requirements.txt

      - name: Install dependencies
        run: pip install -r tools/requirements.txt

      - name: Scrape
        id: scrape
        working-directory: tools
        env:
          MAX_PAGES: ${{ inputs.max_pages || '60' }}
          IGNORE_ROBOTS: ${{ inputs.ignore_robots }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          args=(
            --max-pages "${MAX_PAGES}"
            --summary-file "${RUNNER_TEMP}/summary.txt"
            --pr-body-file "${RUNNER_TEMP}/pr-body.md"
          )
          if [ "${IGNORE_ROBOTS}" = "true" ]; then
            args+=(--ignore-robots)
          fi
          if [ "${DRY_RUN}" = "true" ]; then
            args+=(--dry-run)
          fi
          python scrape_knowledge.py "${args[@]}"

      - name: Publish summary
        if: always()
        run: |
          {
            echo "## Stage 1 — raw archive"
            echo
            echo '```'
            cat "${RUNNER_TEMP}/summary.txt" 2>/dev/null || echo "No summary produced."
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Check for changes
        id: diff
        run: |
          set -euo pipefail
          if git diff --quiet -- knowledge/raw/ardb-raw.json; then
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            echo "The scrape found nothing new. The archive is unchanged."
            echo "The archive is unchanged — ARDB's pages have not moved." \
              >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "changed=true" >> "${GITHUB_OUTPUT}"
            git --no-pager diff --stat -- knowledge/raw/ardb-raw.json
          fi

      - name: Open pull request
        if: steps.diff.outputs.changed == 'true' && inputs.dry_run != true
        uses: ./.github/actions/open-pr
        with:
          # The run id keeps the branch unique. The version alone is
          # date-plus-entry-count, so two runs on the same day that keep the
          # same number of pages collide and the push is rejected.
          branch: knowledge/raw-${{ steps.scrape.outputs.version || github.run_id }}-${{ github.run_id }}
          title: "Archive ARDB pages as published (${{ steps.scrape.outputs.version || 'unversioned' }})"
          body-file: ${{ runner.temp }}/pr-body.md
          paths: knowledge/raw/ardb-raw.json knowledge/HISTORY.jsonl
          # A pull request opened with this token does not trigger other
          # workflows, so CI will not run on the branch until a human reopens
          # the pull request or re-runs CI by hand.
          token: ${{ secrets.GITHUB_TOKEN }}
