name: Scrape knowledge base

# Opens a pull request rather than committing to a branch. The crawler is a
# heuristic over a WordPress theme, and an unreviewed knowledge file is how a
# navigation blob -- or a wrong interest rate -- reaches a customer.
on:
  workflow_dispatch:
    inputs:
      max_pages:
        description: "Maximum pages to crawl"
        required: false
        default: "60"
        type: string
      ignore_robots:
        description: "Crawl regardless of robots.txt (ARDB's own site only)"
        required: false
        default: false
        type: boolean
      consolidate:
        description: "Restate every page as normalized English (costs Claude tokens)"
        required: false
        default: true
        type: boolean
      dry_run:
        description: "Report what would change without opening a pull request"
        required: false
        default: false
        type: boolean
  schedule:
    # 03:17 UTC on the first of each month. An odd minute because schedules on
    # the hour are the most delayed; monthly because published product terms
    # change slowly.
    - cron: "17 3 1 * *"

permissions:
  contents: write
  pull-requests: write

concurrency:
  # Two concurrent scrapes would race on the same branch.
  group: scrape-knowledge
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tools/requirements.txt

      - name: Install dependencies
        run: pip install -r tools/requirements.txt

      - name: Scrape
        id: scrape
        working-directory: tools
        env:
          MAX_PAGES: ${{ inputs.max_pages || '60' }}
          IGNORE_ROBOTS: ${{ inputs.ignore_robots }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          args=(
            --max-pages "${MAX_PAGES}"
            --summary-file "${RUNNER_TEMP}/summary.txt"
            --pr-body-file "${RUNNER_TEMP}/pr-body.md"
          )
          if [ "${IGNORE_ROBOTS}" = "true" ]; then
            args+=(--ignore-robots)
          fi
          if [ "${DRY_RUN}" = "true" ]; then
            args+=(--dry-run)
          fi
          python scrape_knowledge.py "${args[@]}"

      - name: Check the Claude credential before spending anything
        if: inputs.consolidate != false
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
        run: |
          set -euo pipefail
          if [ -z "${ANTHROPIC_API_KEY:-}" ]; then
            echo "::error::ANTHROPIC_API_KEY is not set. Add it under Settings → Secrets and variables → Actions, or uncheck 'consolidate' to scrape only."
            exit 1
          fi
          if [ -n "${ANTHROPIC_WORKSPACE_ID:-}" ]; then
            echo "Scoping requests to workspace ${ANTHROPIC_WORKSPACE_ID}."
          fi
          case "${ANTHROPIC_API_KEY}" in
            sk-ant-*) ;;
            *) echo "::warning::ANTHROPIC_API_KEY does not start with sk-ant-. If the run fails to authenticate, the secret is probably wrong." ;;
          esac

      - name: Consolidate into normalized English
        id: consolidate
        if: inputs.consolidate != false
        working-directory: tools
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Needed only when the key is organization-level rather than scoped
          # to a workspace. An unscoped key authenticates, then every request
          # is rejected with "not scoped to a workspace".
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          args=(
            --summary-file "${RUNNER_TEMP}/consolidate-summary.txt"
            --pr-body-file "${RUNNER_TEMP}/pr-body.md"
          )
          if [ "${DRY_RUN}" = "true" ]; then
            args+=(--dry-run)
          fi

          # Exit 1 means some entries failed figure verification. Those keep
          # their Khmer text rather than shipping an unverified rewrite, so
          # the run is still useful -- the failures are named in the pull
          # request for review. Only a harder failure should stop the run.
          if python consolidate_knowledge.py "${args[@]}"; then
            echo "verified=all" >> "${GITHUB_OUTPUT}"
          else
            status=$?
            if [ "${status}" -eq 1 ]; then
              # Some entries kept their Khmer text. The run is still useful and
              # the causes are grouped in the pull request.
              echo "verified=partial" >> "${GITHUB_OUTPUT}"
              echo "::warning::Some entries were not consolidated and kept their Khmer text. See the pull request for the cause of each."
            elif [ "${status}" -eq 2 ]; then
              # Configuration, not corpus: the pre-flight request was
              # rejected, so no page was ever sent.
              echo "::error::Consolidation could not use the Claude credentials. The step output above carries the API's own message and the remedy. No entry failed verification."
              exit 1
            elif [ "${status}" -eq 3 ]; then
              # Every entry failed after the credentials checked out. A
              # warning on a green run would hide a total failure.
              echo "::error::No entry was consolidated. The corpus is unchanged Khmer and the causes are in the step output above."
              exit 1
            else
              exit "${status}"
            fi
          fi

          cat "${RUNNER_TEMP}/consolidate-summary.txt" >> "${RUNNER_TEMP}/summary.txt"

      - name: Publish summary
        if: always()
        run: |
          {
            echo "## Knowledge base scrape"
            echo
            echo '```'
            cat "${RUNNER_TEMP}/summary.txt" 2>/dev/null || echo "No summary produced."
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Check for changes
        id: diff
        run: |
          set -euo pipefail
          if git diff --quiet -- knowledge/ardb-knowledge.json; then
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            echo "The scrape produced no change to the knowledge base."
          else
            echo "changed=true" >> "${GITHUB_OUTPUT}"
            git --no-pager diff --stat -- knowledge/ardb-knowledge.json
          fi

      - name: Push branch and open pull request
        if: steps.diff.outputs.changed == 'true' && inputs.dry_run != true
        env:
          # Pull requests opened with this token do not trigger other
          # workflows, so CI will not run on the branch until a human reopens
          # the pull request or re-runs CI by hand.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.scrape.outputs.version }}
        run: |
          set -euo pipefail

          # The run id keeps the branch unique. The version alone is
          # date-plus-entry-count, so two runs on the same day that keep the
          # same number of pages collide and the push is rejected -- which is
          # exactly what happened on run 3.
          branch="knowledge/scrape-${VERSION:-$(date -u +%Y%m%d-%H%M)}-${GITHUB_RUN_ID}"

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "${branch}"
          git add knowledge/ardb-knowledge.json
          git commit -m "Refresh ARDB knowledge base (${VERSION:-unversioned})"
          git push --set-upstream origin "${branch}"

          # The branch is now safe on the remote, so the scrape cannot be lost
          # from here on. Opening the pull request is the part that can be
          # refused: GITHUB_TOKEN cannot create one unless "Allow GitHub
          # Actions to create and approve pull requests" is enabled in
          # Settings -> Actions -> General, and that is off by default. Treat
          # a refusal as a degraded success and hand over a one-click link
          # rather than failing a run whose real work succeeded.
          #
          # Body comes from a file written by the scraper: a heredoc here
          # would carry the YAML indentation into the Markdown and render
          # every line as a code block.
          compare_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/${GITHUB_REF_NAME}...${branch}?expand=1"

          if gh pr create \
              --title "Refresh ARDB knowledge base (${VERSION:-unversioned})" \
              --body-file "${RUNNER_TEMP}/pr-body.md" \
              --base "${GITHUB_REF_NAME}" \
              --head "${branch}" 2> "${RUNNER_TEMP}/pr-error.txt"; then
            echo "Pull request opened."
            {
              echo "### Pull request opened"
              echo
              gh pr view "${branch}" --json url --jq .url
            } >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          cat "${RUNNER_TEMP}/pr-error.txt"

          if grep -qi "not permitted to create or approve pull requests" "${RUNNER_TEMP}/pr-error.txt"; then
            {
              echo "### Branch pushed — open the pull request manually"
              echo
              echo "The scrape succeeded and \`${branch}\` is pushed. GitHub"
              echo "refused to let Actions open the pull request, which is the"
              echo "default for a repository."
              echo
              echo "**[Open the pull request](${compare_url})**"
              echo
              echo "To let future runs open it automatically, enable"
              echo "*Settings → Actions → General → Workflow permissions →"
              echo "Allow GitHub Actions to create and approve pull requests*."
            } >> "${GITHUB_STEP_SUMMARY}"
            echo "::warning::Branch ${branch} pushed, but Actions is not permitted to open pull requests. Open it at ${compare_url}"
            exit 0
          fi

          # Any other failure is a real one.
          {
            echo "### Pull request could not be opened"
            echo
            echo "Branch \`${branch}\` is pushed. \`gh pr create\` failed:"
            echo
            echo '```'
            cat "${RUNNER_TEMP}/pr-error.txt"
            echo '```'
            echo
            echo "**[Open it manually](${compare_url})**"
          } >> "${GITHUB_STEP_SUMMARY}"
          exit 1
